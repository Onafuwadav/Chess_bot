# Builds and tests the engine on every push and pull request. When a version tag such as
# v1.0 is pushed, it also publishes Chess_bot-windows.zip as a GitHub Release.
#
#   git tag v1.0
#   git push origin v1.0

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as local development: MSYS2 UCRT64 GCC, CMake and Ninja
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ./build/engine_tests.exe

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"

      - name: Upload zip (downloadable from the run's page)
        uses: actions/upload-artifact@v4
        with:
          name: Chess_bot-windows
          path: dist/Chess_bot/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/Chess_bot-windows.zip
          --title "Chess_bot ${{ github.ref_name }}" --generate-notes
